<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>整商高校看板 · 10月(10月1-14日) vs 6月</title>
<style>
:root{
  --bg:#f1f5f9;--card:#fff;--line:#e5e9f0;--line2:#eef2f7;
  --tx:#0f172a;--tx2:#475569;--tx3:#8b98a9;
  --green:#0f766e;--red:#b91c1c;--blue:#1d4ed8;--amber:#b45309;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);
  font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1680px;margin:0 auto;padding:24px 20px 64px}

/* header */
header{margin-bottom:20px}
h1{margin:0 0 6px;font-size:23px;letter-spacing:-.3px;font-weight:700}
h1 .tag{display:inline-block;margin-left:10px;padding:2px 9px;border-radius:99px;
  background:#e0f2f1;color:#0f766e;font-size:12px;font-weight:600;vertical-align:3px}
.meta{color:var(--tx2);font-size:12.5px}
.meta b{color:var(--tx);font-weight:600}
.meta .sep{margin:0 8px;color:#cbd5e1}

/* section */
section{margin-bottom:26px}
.h2{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:16px;font-weight:700}
.h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--green)}
.h2 .sub{font-weight:400;font-size:12px;color:var(--tx3);margin-left:2px}

.cal{background:#fff;border:1px solid var(--line);border-left:3px solid #94a3b8;
  border-radius:6px;padding:9px 13px;color:var(--tx2);font-size:12px;margin:0 0 14px}
.cal b{color:var(--tx)}

/* summary cards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media(max-width:1180px){.cards{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px 16px 16px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card h3{margin:0 0 11px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .pill{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px}
.pill.g{background:#e0f2f1;color:#0f766e}
.pill.b{background:#e8eefc;color:#1d4ed8}
.pill.a{background:#fdf1e3;color:#b45309}

table{border-collapse:separate;border-spacing:0;width:100%}
.card table{font-size:12.5px}
th,td{padding:6px 9px;text-align:right;white-space:nowrap;
  border-bottom:1px solid var(--line2)}
thead th{background:#f8fafc;color:var(--tx2);font-weight:600;font-size:11.5px;
  border-bottom:1px solid var(--line);position:relative}
thead th .u{display:block;font-size:10px;color:var(--tx3);font-weight:500}
th.l,td.l{text-align:left}
tbody tr:hover td{background:#fafcff}
.card tbody tr:hover td{background:transparent}
tbody tr.tot td{font-weight:700;background:#f8fafc;border-top:1.5px solid #cbd5e1}
tbody tr:last-child td{border-bottom:none}
td.city,th.city{font-weight:600;color:var(--tx)}
.tot td.city{color:#0f172a}
.big{font-weight:700}
/* 汇总卡片紧凑化（放在通用 th/td 之后生效） */
.card{overflow-x:auto}
.card table{font-size:12px}
.card th,.card td{padding:5px 7px}
.card thead th{font-size:11px}
.card td.city{min-width:82px}

/* 明细 */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:14px;
  background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:12px}
.filters label{font-size:12.5px;color:var(--tx2);display:flex;align-items:center;gap:6px}
select{font:inherit;font-size:12.5px;padding:5px 26px 5px 9px;border:1px solid #cbd5e1;
  border-radius:7px;background:#fff;color:var(--tx);appearance:none;cursor:pointer;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%2394a3b8'/></svg>");
  background-repeat:no-repeat;background-position:right 9px center}
select:focus{outline:2px solid #bfdbfe;outline-offset:1px}
.filters .sp{flex:1}
.filters .cnt{font-size:12px;color:var(--tx3)}
.chips{display:flex;gap:6px}
.chips button{font:inherit;font-size:12px;padding:4px 12px;border:1px solid #cbd5e1;
  background:#fff;border-radius:99px;cursor:pointer;color:var(--tx2)}
.chips button.on{background:#0f766e;border-color:#0f766e;color:#fff;font-weight:600}

.scroll{overflow:auto;max-height:76vh;background:#fff;border:1px solid var(--line);
  border-radius:10px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
table.dt{border-spacing:0;font-size:11.5px;width:auto;min-width:100%}
table.dt th,table.dt td{padding:4px 9px;border-bottom:1px solid #f1f5f9;border-right:1px solid #f6f8fb}
table.dt thead th{position:sticky;top:0;z-index:3;background:#f8fafc;
  font-size:11.5px;color:var(--tx2);border-bottom:1px solid #dbe2ea}
/* 三层表头：板块行 / 子板块行 / 指标行，行高固定保证吸附不错位 */
/* 合并标题左对齐 + 贴左边框：避免跨列太多时标题跑到屏幕外看不见 */
table.dt thead th.st1{top:0;height:26px;text-align:left;font-weight:700;font-size:12px;
  padding-left:12px;border-left:2px solid #cbd5e1}
table.dt thead th.st2{top:26px;height:26px;text-align:left;font-weight:600;font-size:11.5px;
  padding-left:12px;border-left:2px solid #dbe2ea}
table.dt thead th.st3{top:52px}
table.dt thead th.gstart{border-left:2px solid #dbe2ea}
table.dt thead th.c0.st1{top:0;text-align:left}
table.dt th.sec0{background:#eef7f5}table.dt th.sec1{background:#eef2fc}table.dt th.sec2{background:#fdf4ea}
table.dt th.sec0,table.dt th.sec1,table.dt th.sec2{color:#334155}
table.dt th.c0,table.dt td.c0{position:sticky;left:0;z-index:4;background:#fff;
  border-right:1.5px solid #dbe2ea;text-align:left;font-weight:600;min-width:186px}
table.dt thead th.c0{background:#f8fafc;z-index:5}
table.dt tr.campus td.c0{padding-left:22px;font-weight:400;color:var(--tx2)}
table.dt tr.tot td{background:#f8fafc;font-weight:700}
table.dt tr.tot td.c0{background:#f8fafc}
table.dt tbody tr:hover td{background:#f8fbff}
table.dt tbody tr:hover td.c0{background:#eef6ff}
td.z{color:#cbd5e1}
.foot{margin-top:28px;color:var(--tx3);font-size:11.5px;line-height:1.9}
</style>
</head>

  <header>
    <h1>整商高校看板<span class="tag">10月 vs 6月</span></h1>
    <div class="meta">

  <section>

  <section>

  </section>

  <div class="foot" id="foot"></div>
</div>

/* ---------- 数值格式化 ---------- */
function fmt(v, t){
  if(v===null||v===undefined||v==='') return '-';
  if(typeof v==='string') return v;
  if(t==='pct')  return (v*100).toFixed(1)+'%';
  if(t==='pt')   return (v*100>=0?'+':'')+(v*100).toFixed(2);
  if(t==='num2') return v.toFixed(2);
  if(t==='int')  return Math.round(v).toLocaleString('en-US');
  return String(v);
}
/* 百分比色阶：0=红 → .5=黄 → 1=绿（浅底，用于"越高越好"的恢复率） */
function heatBg(v){
  const x=Math.max(0,Math.min(1,v)), h=x*120;
  return 'hsl('+h+',62%,94%)';
}
/* 量级色阶：蓝（浅→深），仅表达数值大小，不暗示好坏 */
function blueBg(v){
  const x=Math.max(0,Math.min(1,v));
  return 'hsl(214,72%,'+(97-x*13)+'%)';
}
/* 涨跌：正=红 / 负=绿（中国惯例），带箭头 */
function signedHtml(v){
  if(v===null||v===undefined||v==='') return '-';
  const p=v*100, up=p>=0;
  const col=up?'var(--red)':'var(--green)';
  return '<span style="color:'+col+';font-weight:600">'+(up?'\u2191':'\u2193')+Math.abs(p).toFixed(2)+'</span>';
}
function pctCell(v){ // 百分比 + 色阶
  if(v===null||v===undefined||v==='') return '<td>'+'-'+'</td>';
  return '<td class="big" style="background:'+heatBg(v)+'">'+(v*100).toFixed(1)+'%</td>';
}

/* ---------- 汇总卡片 ---------- */
const CITY_ROWS = D.cities.concat(['__total__']);

function rowOf(city){
  if(city==='__total__'){ const t=D.rows.find(r=>r.kind==='total'); return {label:'合计',v:t.v}; }
  const t=D.rows.find(r=>r.kind==='city'&&r.city===city);
  return {label:city, v:t.v};
}
function aggOf(city){
  return city==='__total__' ? D.agg['__total__'] : (D.agg[city]||{});
}
/* 8日-至今 聚合：{o:订单合计, g:净GMV合计, n:天数} */
function sinceAgg(c){
  const a=aggOf(c); let o=0,g=0;
  D.sinceDates.forEach(d=>{ if(a[d]){ o+=a[d][0]; g+=a[d][1]; } });
  return {o:o, g:g, n:D.sinceDates.length};
}

/* 下标 = 0-based 列索引 - 1（v 数组自 B 列起） */
const C={order:0, juneOrder:1, d8:2, d7:3, d6:4, r8:5, r7:6, r6:7,
  net:12, juneNet:13, sub:27, juneSub:28, subPt:29,
  mj:60, mf:61, tc:62, bd:63, pt:64};
const DAYS=D.days3;

function cardOrder(){
  let h='<table><thead><tr><th class="l city" rowspan="2">城市 / 区县</th>'
    +'<th rowspan="2">'+D.sinceLabel+'-至今<span class="u">日均订单</span></th>'
    +'<th rowspan="2">6月<span class="u">日均</span></th>'
    +'<th rowspan="2">至今<span class="u">恢复</span></th>'
    +'<th colspan="6" style="text-align:center">近 3 日（单日订单 / 恢复率）</th></tr><tr>'
    +DAYS.map(d=>'<th>'+d[1]+'<span class="u">订单</span></th><th>'+d[1]+'<span class="u">恢复</span></th>').join('')
    +'</tr></thead><tbody>';
  CITY_ROWS.forEach(c=>{
    const r=rowOf(c), v=r.v, sa=sinceAgg(c);
    const avg=sa.o/sa.n, rec=avg/v[C.juneOrder];
    h+='<tr'+(c==='__total__'?' class="tot"':'')+'><td class="l city">'+r.label+'</td>';
    h+='<td>'+fmt(avg,'int')+'</td><td>'+fmt(v[C.juneOrder],'int')+'</td>';
    h+=pctCell(rec);
    DAYS.forEach((d,i)=>{
      const o=v[[C.d8,C.d7,C.d6][i]];
      h+='<td>'+fmt(o,'int')+'</td>'+pctCell(v[[C.r8,C.r7,C.r6][i]]);
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

function cardNet(){
  let h='<table><thead><tr><th class="l city" rowspan="2">城市 / 区县</th>'
    +'<th rowspan="2">'+D.sinceLabel+'-至今<span class="u">日均净GMV</span></th>'
    +'<th rowspan="2">6月<span class="u">日均</span></th>'
    +'<th rowspan="2">至今<span class="u">恢复</span></th>'
    +'<th colspan="6" style="text-align:center">近 3 日（单日净GMV / 恢复率）</th></tr><tr>'
    +DAYS.map(d=>'<th>'+d[1]+'<span class="u">净GMV</span></th><th>'+d[1]+'<span class="u">恢复</span></th>').join('')
    +'</tr></thead><tbody>';
  CITY_ROWS.forEach(c=>{
    const r=rowOf(c), v=r.v, base=v[C.juneNet], sa=sinceAgg(c);
    const avg=sa.g/sa.n, rec=avg/base;
    h+='<tr'+(c==='__total__'?' class="tot"':'')+'><td class="l city">'+r.label+'</td>';
    h+='<td>'+fmt(avg,'int')+'</td><td>'+fmt(base,'int')+'</td>';
    h+=pctCell(rec);
    const a=aggOf(c);
    DAYS.forEach(d=>{
      const e=a[d?d[0]:''];
      const g=e?e[1]:null;
      h+='<td>'+fmt(g,'int')+'</td>';
      h+= g===null ? '<td>-</td>' : pctCell(g/base);
    });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

function cardSub(){
  let h='<table><thead><tr><th class="l city">城市 / 区县</th>'
    +'<th>代补力度<span class="u">10月</span></th><th>代补力度<span class="u">6月</span></th>'
    +'<th>vs 6月<span class="u">增长点位</span></th></tr></thead><tbody>';
  CITY_ROWS.forEach(c=>{
    const r=rowOf(c), v=r.v;
    h+='<tr'+(c==='__total__'?' class="tot"':'')+'><td class="l city">'+r.label+'</td>';
    h+='<td class="big">'+fmt(v[C.sub],'pct')+'</td>';
    h+='<td>'+fmt(v[C.juneSub],'pct')+'</td>';
    h+='<td class="big">'+signedHtml(v[C.subPt])+'</td></tr>';
  });
  return h+'</tbody></table>';
}

function cardMk(){
  const items=[[C.mj,'满减'],[C.mf,'免配'],[C.tc,'特价菜'],[C.bd,'爆单红包'],[C.pt,'拼团']];
  let h='<table><thead><tr><th class="l city">城市 / 区县</th>'
    +items.map(it=>'<th>'+it[1]+'<span class="u">订单占比</span></th>').join('')
    +'</tr></thead><tbody>';
  CITY_ROWS.forEach(c=>{
    const r=rowOf(c), v=r.v;
    h+='<tr'+(c==='__total__'?' class="tot"':'')+'><td class="l city">'+r.label+'</td>';
    items.forEach(it=>{ h+='<td class="big" style="background:'+blueBg(v[it[0]])+'">'+fmt(v[it[0]],'pct')+'</td>'; });
    h+='</tr>';
  });
  return h+'</tbody></table>';
}

D.cities.forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; fcity.appendChild(o); });

  .forEach(s=>{ const o=document.createElement('option'); o.value=s.v; o.textContent=s.t; fsec.appendChild(o); });

const QUICK=[['-1','全部'],['0',D.secNames[0]],['1',D.secNames[1]],['2',D.secNames[2]]];
document.getElementById('fquick').innerHTML =
  QUICK.map(q=>'<button data-s="'+q[0]+'"'+(q[0]==='-1'?' class="on"':'')+'>'+q[1]+'</button>').join('');
document.getElementById('fquick').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  fsec.value=b.dataset.s;
  document.querySelectorAll('#fquick button').forEach(x=>x.classList.toggle('on',x===b));
  build();
});
fsec.addEventListener('change',()=>{
  document.querySelectorAll('#fquick button').forEach(x=>x.classList.toggle('on',x.dataset.s===fsec.value));
  build();
});
fcity.addEventListener('change',build);

function build(){
  const city=fcity.value, sec=parseInt(fsec.value,10);
  const useCols=D.cols.map((c,i)=>({...c,i})).filter(c=>c.i===0||sec<0||c.sec===sec);
  const rows=D.rows.filter(r=>!city||r.city===city||r.kind==='total');

  let nCol=0, nCell=0, nErr=0;
  /* 三层表头：板块(行1) / 子板块(行2) / 指标(行3)，按可见列的连续区段合并 */
  const dataCols=useCols.filter(c=>c.i>0);
  function runsOf(keyf){
    const runs=[];
    dataCols.forEach(c=>{
      const k=keyf(c), last=runs[runs.length-1];
      if(last&&last.k===k) last.n++;
      else runs.push({k:k, c:c, n:1});
    });
    return runs;
  }
  let h='<thead>';
  h+='<tr class="hdr1"><th class="c0 st1" rowspan="3">'+D.cols[0].n+'</th>';
  runsOf(c=>c.sec).forEach(r=>{
    h+='<th class="st1 sec'+r.c.sec+'" colspan="'+r.n+'">'+D.secNames[r.c.sec]+'</th>';
  });
  h+='</tr><tr class="hdr2">';
  runsOf(c=>c.sub).forEach(r=>{
    h+='<th class="st2 sec'+r.c.sec+'" colspan="'+r.n+'" title="'+(r.c.sub||'')+'">'+(r.c.sub||'')+'</th>';
  });
  h+='</tr><tr class="hdr3">';
  let psub=null;
  dataCols.forEach(c=>{
    nCol++;
    const gs=(c.sub!==psub)?' gstart':''; psub=c.sub;
    h+='<th class="sec'+c.sec+' st3'+gs+'" title="'+(c.sub||'')+'">'+c.n+'</th>';
  });
  h+='</tr></thead><tbody>';
  rows.forEach(r=>{
    h+='<tr class="'+r.kind+'"><td class="c0">'+r.label+'</td>';
    useCols.forEach(c=>{
      if(c.i===0) return;
      const v=r.v[c.i-1];
      nCell++;
      if(typeof v==='string'&&v.startsWith('#')){ nErr++; h+='<td class="z">'+v+'</td>'; return; }
      if(v===null||v===undefined||v===''){ h+='<td class="z">-</td>'; return; }
      if(c.f==='pt'){ h+='<td>'+signedHtml(v)+'</td>'; return; }
      let style='', txt=fmt(v,c.f);
      if(c.n.indexOf('恢复')>=0) style='background:'+heatBg(v);
      h+='<td style="'+style+'">'+txt+'</td>';
    });
    h+='</tr>';
  });
  h+='</tbody>';
  document.getElementById('dt').innerHTML=h;
  document.getElementById('cnt').textContent =
    '显示 '+rows.length+' 行 × '+nCol+' 列（'+nCell+' 格'+(nErr?'，含 '+nErr+' 个原表固有 #DIV/0!':'')+'）';
}

document.getElementById('foot').innerHTML =
  '数据来源：轩辕 ARK「高校综合看板数据集」+「有效商户明细_FY26」（10月1-14日）｜'
  +'对比基准：6 月全月日均（6/1–6/30，30 天）｜生成时间：2026-10-15 14:33<br>'
  +'说明：看板结构来自「整商高校10月看板（10月1-14日 vs 6月）.xlsx」，本页为只读展示，数值与源表一致。';

build();
</script>
