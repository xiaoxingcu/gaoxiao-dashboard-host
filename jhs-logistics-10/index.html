const R2 = v => v==null ? '-' : (v*100).toFixed(2)+'%';
const R1 = v => v==null ? '-' : v.toFixed(1);
const N0 = v => v==null ? '-' : Math.round(v).toLocaleString();

// 率值色阶：higherBetter=true 时值越大越绿
function heat(v, min, max, higherBetter){
  if(v==null||max===min) return '';
  let t=(v-min)/(max-min);
  if(!higherBetter) t=1-t;
  const h=Math.round(120*t);
  return 'background:hsl('+h+',62%,94%)';
}
function blueScale(v,min,max){
  if(v==null||max===min) return '';
  const t=(v-min)/(max-min);
  const l=(97-13*t).toFixed(0);
  return 'background:hsl(214,72%,'+l+'%)';
}
function colRange(rows, idx){
  let mn=Infinity,mx=-Infinity;
  rows.forEach(r=>{const v=r[idx]; if(v==null)return; if(v<mn)mn=v; if(v>mx)mx=v;});
  return (mn===Infinity)?[0,0]:[mn,mx];
}

function fmtCell(v,idx){
  const h=DATA.hdrDaily[idx];
  if(idx===0){ const s=String(v); return s.slice(4,6)+'/'+s.slice(6,8); }
  if(idx===1) return N0(v);
  if(h.indexOf('率')>=0) return R2(v);
  return R1(v);
}
function cellStyle(v,idx,rows){
  const h=DATA.hdrDaily[idx];
  if(v==null) return '';
  if(idx===1) { const [mn,mx]=colRange(rows,1); return blueScale(v,mn,mx); }

    const hb=(h.indexOf('未妥投')>=0||h.indexOf('不完美')>=0)?false:true;
    const [mn,mx]=colRange(rows,idx);
    return heat(v,mn,mx,hb);
  }
  return '';
}

  thead1+='<th colspan="6">时长类（均值）</th>';
  thead2='<th></th>'.repeat(7);
  for(let c=8;c<=13;c++){ thead2+='<th>'+DATA.hdrDaily[c]+'</th>'; }
  thead2='<tr class="sub">'+thead2+'</tr>';
  let body='';
  rows.forEach(r=>{
    let tr='<tr><td style="text-align:left">'+fmtCell(r[0],0)+'</td>';
    for(let c=1;c<DATA.hdrDaily.length;c++){
      if(c>=8&&c<=13){}
      tr+='<td class="num" style="'+cellStyle(r[c],c,rows)+'">'+fmtCell(r[c],c)+'</td>';
    }
    body+=tr+'</tr>';
  });
  document.getElementById('tblwrap').innerHTML=
    '<table><thead><tr>'+thead1+'</tr>'+thead2+'</thead><tbody>'+body+'</tbody></table>';
}
sel.addEventListener('change',()=>renderDetail(+sel.value));

// ---------- 概览 ----------
function renderOverview(){
  const idxMap=[0,1,2,3,4];
  const heads=['站点','📢','日均订单','妥投率','物流未妥投率','准时率(T)','治理用不完美订单率'];
  let html='<table class="overview"><thead><tr>';
  heads.forEach(h=>html+='<th>'+h+'</th>');
  html+='</tr></thead><tbody>';
  const cols=[1,2,3,4];
  const ranges=cols.map(c=>{
    let mn=Infinity,mx=-Infinity;
    DATA.stations.forEach(s=>{const v=s.metrics[c];if(v==null)return;if(v<mn)mn=v;if(v>mx)mx=v;});
    return [mn===Infinity?0:mn,mx===-Infinity?0:mx];
  });
  DATA.stations.forEach(s=>{
    html+='<tr><td>'+s.name+'</td>';
    html+='<td>'+(s.bcast?'📢':'')+'</td>';
    html+='<td class="num" style="'+blueScale(s.metrics[0],ranges[0][0],ranges[0][1])+'">'+N0(s.metrics[0])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[1],ranges[1][0],ranges[1][1],true)+'">'+R2(s.metrics[1])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[2],ranges[2][0],ranges[2][1],false)+'">'+R2(s.metrics[2])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[3],ranges[3][0],ranges[3][1],true)+'">'+R2(s.metrics[3])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[4],ranges[4][0],ranges[4][1],false)+'">'+R2(s.metrics[4])+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById('ovwrap').innerHTML=html;
}

// URL 参数预选（截图用）：?st=<index 或 站名>
(function(){
  const q=new URLSearchParams(location.search);
  let idx=0;
  if(q.get('st')!==null){
    const v=q.get('st');
    const byName=DATA.stations.findIndex(s=>s.name===v);
    if(byName>=0) idx=byName; else if(!isNaN(+v)) idx=+v;
  }
  sel.value=idx;
  renderDetail(idx);
  renderOverview();
})();
</script>
