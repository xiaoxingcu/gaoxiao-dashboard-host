<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>11月高校聚合送物流质量看板</title>
<style>
:root{
  --bg:#f5f7fa; --card:#ffffff; --line:#e5e9f0; --txt:#1f2937; --sub:#6b7280;
  --brand:#1d4ed8; --good:#0f766e; --bad:#b91c1c; --warn:#d97706;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);
  font-family:"Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1500px;margin:0 auto;padding:20px 18px 40px}
header{margin-bottom:14px}
h1{font-size:26px;font-weight:700;letter-spacing:.5px}
.meta{color:var(--sub);font-size:13.5px;margin-top:4px}
.meta b{color:var(--txt)}
.filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 6px}
.filters label{font-size:14px;color:var(--sub)}
select{font-size:15px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;
  background:#fff;color:var(--txt);min-width:280px;outline:none}
select:focus{border-color:var(--brand)}
.chip{font-size:12.5px;color:#fff;background:var(--brand);border-radius:99px;padding:2px 10px}
.chip.gray{background:#9ca3af}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0 18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .t{font-size:13px;color:var(--sub);margin-bottom:6px}
.kpi .v{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:14px;font-weight:600;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:18px}
.card h2{font-size:16.5px;margin-bottom:10px}
.card h2 .sub{font-size:13px;color:var(--sub);font-weight:400;margin-left:8px}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:640px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13.5px;white-space:nowrap}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid #eef1f6;text-align:center}
thead th{background:#f0f4f9;font-weight:600;position:sticky;top:0;z-index:3;font-size:13px}
thead tr.sub th{top:37px;background:#f7fafc;z-index:3;font-weight:500;color:#374151}
tbody td:first-child,thead th:first-child{position:sticky;left:0;z-index:2;background:#f7fafc;font-weight:600}
thead th:first-child{z-index:4}
tbody tr:hover td{background:#f3f7ff}
tbody tr:hover td:first-child{background:#eef4fd}
td.num{font-variant-numeric:tabular-nums}
td.uptrend{color:var(--bad);font-weight:600}
td.good{color:var(--good);font-weight:600}
.overview td:first-child{position:sticky;left:0;text-align:left;max-width:260px}
footer{color:var(--sub);font-size:12.5px;margin-top:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--sub);margin:6px 0 12px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:4px;vertical-align:-2px}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>11月高校聚合送物流质量看板</h1>
  <div class="meta">数据截至 <b>2026-11-01</b>（11/1–11/1 已出数日）｜ 覆盖范围：<b>衡阳合并经营 · 聚合送站点</b>｜ 月度：202611</div>
</header>

<div class="filters">
  <span class="chip">学校筛选</span>
  <select id="sel"></select>
  <span class="chip gray" id="tagBcast"></span>
</div>

<section id="detail">
  <div class="cards" id="kpis"></div>
  <div class="card">
    <h2>物流数据综合看板 · 日维度<span class="sub" id="stName"></span></h2>
    <div class="legend">
      <span><i style="background:hsl(120,62%,88%)"></i>率值越绿越好</span>
      <span><i style="background:hsl(0,62%,88%)"></i>越红越差</span>
      <span><i style="background:hsl(214,72%,90%)"></i>订单量为蓝色量级（中性）</span>
    </div>
    <div class="scroll" id="tblwrap"></div>
  </div>
</section>

<section class="card" id="ovCard">
  <h2>全部站点概览（衡阳 8 站）<span class="sub">按日均订单降序 · 📢 = 播报站点</span></h2>
  <div class="scroll" id="ovwrap"></div>
</section>

<footer>数据来源：轩辕 ARK（城代校区站点物流履约 46797 / 严重不完美订单专项 63382）· 生成于 2026-11-02 · 仅衡阳合并经营站点</footer>
</div>

<script>

3981338, 0.0007849091352613197, 3.0825390187420707, 24.446010748783, 5.262169185382582, 0.0225298681638072]]}, {"name": "石鼓环境生物学院站点（聚合送）", "bcast": true, "metrics": [1584.0, 0.9912390488110138, 0.001871692743620689, 0.9092615769712139, 0.0434918648310388, 41.402696172305994, 41.04741857305043, 10.150241323374, 0.0010771500593829918, 5.450647014485601, 18.148012422441717, 7.3760891575735075, 0.02878029186704879], "daily": [[20261101.0, 1584.0, 0.9912390488110138, 0.001871692743620689, 0.9092615769712139, 0.0434918648310388, 41.402696172305994, 41.04741857305043, 10.150241323374, 0.0010771500593829918, 5.450647014485601, 18.148012422441717, 7.3760891575735075, 0.02878029186704879]]}, {"name": "蒸湘交通工程学院站（聚合送）", "bcast": true, "metrics": [1192.0, 0.9925062447960034, 0.00166026230670387, 0.8867610324729392, 0.05995004163197336, 43.14375998596375, 42.59047817347207, 14.669422456745046, 0.004317559575721638, 1.822132215221913, 13.252731749211055, 12.916042493387536, 0.020467923790325217], "daily": [[20261101.0, 1192.0, 0.9925062447960034, 0.00166026230670387, 0.8867610324729392, 0.05995004163197336, 43.14375998596375, 42.59047817347207, 14.669422456745046, 0.004317559575721638, 1.822132215221913, 13.252731749211055, 12.916042493387536, 0.020467923790325217]]}, {"name": "雁峰师范学院西校区站（聚合送）", "bcast": true, "metrics": [635.0, 0.9968602825745683, 0.0, 0.9733124018838305, 0.0141287284144427, 40.75686872513716, 40.32814199039081, 13.782047519701932, 0.0013397412946285123, 3.768039442754804, 11.241185106313383, 11.53686992162072, 0.0239891172200517], "daily": [[20261101.0, 635.0, 0.9968602825745683, 0.0, 0.9733124018838305, 0.0141287284144427, 40.75686872513716, 40.32814199039081, 13.782047519701932, 0.0013397412946285123, 3.768039442754804, 11.241185106313383, 11.53686992162072, 0.0239891172200517]]}, {"name": "珠晖高铁学院站（聚合送）", "bcast": true, "metrics": [600.0, 0.974025974025974, 0.004828635745974455, 0.8993506493506493, 0.09740259740259741, 41.68523604091454, 41.660566509497954, 10.833007395738235, 0.0005938494921863129, 3.409440114573557, 16.873137187437028, 10.746170956644782, 0.0135361635369413], "daily": [[20261101.0, 600.0, 0.974025974025974, 0.004828635745974455, 0.8993506493506493, 0.09740259740259741, 41.68523604091454, 41.660566509497954, 10.833007395738235, 0.0005938494921863129, 3.409440114573557, 16.873137187437028, 10.746170956644782, 0.0135361635369413]]}, {"name": "珠晖财经学院站（聚合送）", "bcast": true, "metrics": [188.0, 0.9641025641025641, 0.009467455621301772, 0.7025641025641027, 0.5, 49.6986216006216, 49.67039937839937, 9.924971250971252, 0.0016006216006216021, 17.06260916860916, 0.0, 23.083611499611518, 0.01726184926184925], "daily": [[20261101.0, 188.0, 0.9641025641025641, 0.009467455621301772, 0.7025641025641027, 0.5, 49.6986216006216, 49.67039937839937, 9.924971250971252, 0.0016006216006216021, 17.06260916860916, 0.0, 23.083611499611518, 0.01726184926184925]]}]};
const R2 = v => v==null ? '-' : (v*100).toFixed(2)+'%';
const R1 = v => v==null ? '-' : v.toFixed(1);
const N0 = v => v==null ? '-' : Math.round(v).toLocaleString();

// 率值色阶：higherBetter=true 时值越大越绿
function heat(v, min, max, higherBetter){
  if(v==null||max===min) return '';
  let t=(v-min)/(max-min);
  if(!higherBetter) t=1-t;
  const h=Math.round(120*t);
  return 'background:hsl('+h+',62%,94%)';
}
function blueScale(v,min,max){
  if(v==null||max===min) return '';
  const t=(v-min)/(max-min);
  const l=(97-13*t).toFixed(0);
  return 'background:hsl(214,72%,'+l+'%)';
}
function colRange(rows, idx){
  let mn=Infinity,mx=-Infinity;
  rows.forEach(r=>{const v=r[idx]; if(v==null)return; if(v<mn)mn=v; if(v>mx)mx=v;});
  return (mn===Infinity)?[0,0]:[mn,mx];
}

// ---------- 明细视图 ----------
const sel=document.getElementById('sel');
DATA.stations.forEach((s,i)=>{
  const o=document.createElement('option');
  o.value=i; o.textContent=s.name+(s.bcast?' 📢':'');
  sel.appendChild(o);
});
function fmtCell(v,idx){
  const h=DATA.hdrDaily[idx];
  if(idx===0){ const s=String(v); return s.slice(4,6)+'/'+s.slice(6,8); }
  if(idx===1) return N0(v);
  if(h.indexOf('率')>=0) return R2(v);
  return R1(v);
}
function cellStyle(v,idx,rows){
  const h=DATA.hdrDaily[idx];
  if(v==null) return '';
  if(idx===1) { const [mn,mx]=colRange(rows,1); return blueScale(v,mn,mx); }
  if(h.indexOf('率')>=0){
    const hb=(h.indexOf('未妥投')>=0||h.indexOf('不完美')>=0)?false:true;
    const [mn,mx]=colRange(rows,idx);
    return heat(v,mn,mx,hb);
  }
  return '';
}
function renderDetail(i){
  const s=DATA.stations[i];
  document.getElementById('stName').textContent=s.name;
  const tag=document.getElementById('tagBcast');
  tag.textContent=s.bcast?'📢 播报站点':'非播报站点';
  // KPI
  const kpiDef=[
    ['本月日均订单量', N0(s.metrics[0]), ''],
    ['本月妥投率', R2(s.metrics[1]), (s.metrics[1]!=null&&s.metrics[1]<0.985)?'var(--bad)':''],
    ['本月物流未妥投率', R2(s.metrics[2]), (s.metrics[2]!=null&&s.metrics[2]>0.003)?'var(--bad)':''],
    ['本月准时率(T)', R2(s.metrics[3]), (s.metrics[3]!=null&&s.metrics[3]<0.93)?'var(--bad)':((s.metrics[3]!=null&&s.metrics[3]<0.96)?'var(--warn)':'')],
    ['治理用不完美订单率', R2(s.metrics[4]), (s.metrics[4]!=null&&s.metrics[4]>0.05)?'var(--bad)':((s.metrics[4]!=null&&s.metrics[4]>0.03)?'var(--warn)':'')],
  ];
  document.getElementById('kpis').innerHTML=kpiDef.map(k=>
    '<div class="kpi"><div class="t">'+k[0]+'</div><div class="v" style="'+(k[2]?'color:'+k[2]:'')+'">'+k[1]+'</div></div>').join('');
  // 日表
  const rows=s.daily;
  let thead1='<th rowspan="2" style="text-align:left">日期</th>';
  let thead2='';
  for(let c=1;c<DATA.hdrDaily.length;c++){
    const h=DATA.hdrDaily[c];
    const span=(c>=8&&c<=13)?' rowspan="2"':''; // 时长类合并展示
    if(c>=8&&c<=13){ continue; }
    thead1+='<th'+span+'>'+h+'</th>';
  }
  // 时长类 8..13 作为第二段（row2 需补 7 个空占位格：日期被 rowspan 占据，col2..8 留空）
  thead1+='<th colspan="6">时长类（均值）</th>';
  thead2='<th></th>'.repeat(7);
  for(let c=8;c<=13;c++){ thead2+='<th>'+DATA.hdrDaily[c]+'</th>'; }
  thead2='<tr class="sub">'+thead2+'</tr>';
  let body='';
  rows.forEach(r=>{
    let tr='<tr><td style="text-align:left">'+fmtCell(r[0],0)+'</td>';
    for(let c=1;c<DATA.hdrDaily.length;c++){
      if(c>=8&&c<=13){}
      tr+='<td class="num" style="'+cellStyle(r[c],c,rows)+'">'+fmtCell(r[c],c)+'</td>';
    }
    body+=tr+'</tr>';
  });
  document.getElementById('tblwrap').innerHTML=
    '<table><thead><tr>'+thead1+'</tr>'+thead2+'</thead><tbody>'+body+'</tbody></table>';
}
sel.addEventListener('change',()=>renderDetail(+sel.value));

// ---------- 概览 ----------
function renderOverview(){
  const idxMap=[0,1,2,3,4];
  const heads=['站点','📢','日均订单','妥投率','物流未妥投率','准时率(T)','治理用不完美订单率'];
  let html='<table class="overview"><thead><tr>';
  heads.forEach(h=>html+='<th>'+h+'</th>');
  html+='</tr></thead><tbody>';
  const cols=[1,2,3,4];
  const ranges=cols.map(c=>{
    let mn=Infinity,mx=-Infinity;
    DATA.stations.forEach(s=>{const v=s.metrics[c];if(v==null)return;if(v<mn)mn=v;if(v>mx)mx=v;});
    return [mn===Infinity?0:mn,mx===-Infinity?0:mx];
  });
  DATA.stations.forEach(s=>{
    html+='<tr><td>'+s.name+'</td>';
    html+='<td>'+(s.bcast?'📢':'')+'</td>';
    html+='<td class="num" style="'+blueScale(s.metrics[0],ranges[0][0],ranges[0][1])+'">'+N0(s.metrics[0])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[1],ranges[1][0],ranges[1][1],true)+'">'+R2(s.metrics[1])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[2],ranges[2][0],ranges[2][1],false)+'">'+R2(s.metrics[2])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[3],ranges[3][0],ranges[3][1],true)+'">'+R2(s.metrics[3])+'</td>';
    html+='<td class="num" style="'+heat(s.metrics[4],ranges[4][0],ranges[4][1],false)+'">'+R2(s.metrics[4])+'</td>';
    html+='</tr>';
  });
  html+='</tbody></table>';
  document.getElementById('ovwrap').innerHTML=html;
}

// URL 参数预选（截图用）：?st=<index 或 站名>
(function(){
  const q=new URLSearchParams(location.search);
  let idx=0;
  if(q.get('st')!==null){
    const v=q.get('st');
    const byName=DATA.stations.findIndex(s=>s.name===v);
    if(byName>=0) idx=byName; else if(!isNaN(+v)) idx=+v;
  }
  sel.value=idx;
  renderDetail(idx);
  renderOverview();
})();
</script>
</body>
</html>
